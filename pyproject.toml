[project]
name = "slides-mcp"
version = "0.5.0"
description = "Google Slides MCP server with compact YAML DSL and brand-theme enforcement"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "google-api-python-client>=2.140",
    "google-auth>=2.34",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "pyyaml>=6.0",
    "pydantic>=2.8",
]

[project.scripts]
slides-mcp = "slides_mcp.cli:main"
slides-mcp-auth = "slides_mcp.bootstrap:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slides_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "slides_mcp/_skills_data"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "python-pptx>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
