[project]
name = "slides-mcp"
version = "2.6.0"
description = "MCP server for reading Google Slides decks as agent context, with a narrow write surface for legwork edits and sandboxed deck scripts"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0.10,<5",
    "google-api-python-client>=2.140",
    "google-auth>=2.34",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "mini-racer>=0.14.1",
    "resvg-py>=0.5.0",
]

[project.optional-dependencies]
# `slides-mcp serve-http` only: the Firestore auth store. stdio needs none of it.
http = [
    "google-cloud-storage>=3.16.0",
    "py-key-value-aio[firestore]",
]

[project.scripts]
slides-mcp = "slides_mcp.cli:main"
slides-mcp-auth = "slides_mcp.bootstrap:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slides_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"skills/slides-mcp" = "slides_mcp/_skills_data/slides-mcp"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
