name: text_heavy_body
description: "Title + multi-paragraph body. No images. For long-form content slides."

slots:
  required: [title, paragraphs]
  optional: [notes]

slot_schema:
  title: {type: string}
  paragraphs:
    type: list
    item: {type: string, hint: "markdown, **bold** preserved"}

geometry_defaults:
  title: {left_in: 0.5, top_in: 0.5, w_in: 15.0, h_in: 0.8, font_role: display}
  body:  {left_in: 0.5, top_in: 1.6, w_in: 15.0, h_in: 7.0, font_role: body}

theme_roles_used:
  - fonts.display
  - fonts.body
  - palette.text_body
