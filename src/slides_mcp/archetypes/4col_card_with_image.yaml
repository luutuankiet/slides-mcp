name: 4col_card_with_image
description: "Title + 4 columns each with a colored header, short body, and a small screenshot/image. Optional gradient-labeled footer."

slots:
  required: [title, columns]
  optional: [footer_gradient, brand_stripe, notes]
  constraints:
    columns_count: 4

slot_schema:
  title: {type: string}
  columns:
    type: list
    length: 4
    item:
      type: object
      fields:
        header: {type: string, required: true}
        header_color_role: {type: string, default: brand_accent}
        body: {type: string, required: true}
        image: {type: string, hint: "named asset id"}
  footer_gradient:
    type: object
    fields:
      left: {type: string}
      right: {type: string}
  brand_stripe: {type: string, hint: "named stripe asset id"}

geometry_defaults:
  title: {left_in: 0.5, top_in: 0.5, w_in: 15.0, h_in: 0.8, font_role: display}
  column_width_in: 3.5
  column_gap_in: 0.4
  header: {font_role: pill_header}
  body: {font_role: body_small}
  image: {h_in: 2.0}

theme_roles_used:
  - fonts.display
  - fonts.pill_header
  - fonts.body_small
  - palette.brand_accent
  - palette.text_body
